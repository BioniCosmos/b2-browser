[package]
name = "b2-browser"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
axum = "0.8"
base64 = "0.23"
dotenvy = "0.15"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
