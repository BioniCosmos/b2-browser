name: Build
on:
  push:
    tags: ['*']
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      matrix:
        target:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pre: apt-get -y install musl-tools
            output: linux-x86_64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            pre: apt-get -y install musl-tools
            output: linux-aarch64
          - runner: macos-latest
            target: aarch64-apple-darwin
            output: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: ${{ matrix.pre }}
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: |
          cargo build -r --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/b2-browser b2-browser-${{ matrix.output }}
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: b2-browser-${{ matrix.output }}
          path: b2-browser-${{ matrix.output }}
  publish:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish built binary to GitHub releases
        run: gh release create -R $GITHUB_REPOSITORY -d -n "" b2-browser-*
