<div
  class="min-h-[calc(100vh-1.25rem*2)] flex items-center justify-center bg-gray-100"
>
  <div class="max-w-md w-full p-8 bg-white rounded-lg shadow-sm">
    <form class="space-y-4">
      <div>
        <label for="username" class="sr-only">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-t-md placeholder-gray-500 text-gray-900 focus:outline-hidden focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          placeholder="Username"
        />
      </div>
      <div>
        <label for="password" class="sr-only">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-b-md placeholder-gray-500 text-gray-900 focus:outline-hidden focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          placeholder="Password"
        />
      </div>
      <button
        class="w-full py-2 px-4 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-hidden focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
      >
        Sign in
      </button>
      <div id="error-message" class="hidden text-red-600" />
    </form>
  </div>
</div>
<script type="module">
  const form = document.querySelector('form')
  const button = document.querySelector('button')
  const errorMessage = document.querySelector('#error-message')
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    button.disabled = true
    try {
      const formData = new FormData(form)
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(Object.fromEntries(formData.entries())),
      })
      if (!res.ok) {
        errorMessage.textContent = await res.text()
        errorMessage.classList.remove('hidden')
        return
      }
      location = new URLSearchParams(location.search).get('redirect') ?? '/'
    } catch (e) {
      console.error(e)
      errorMessage.textContent = 'login failed'
      errorMessage.classList.remove('hidden')
    } finally {
      button.disabled = false
    }
  })
</script>
