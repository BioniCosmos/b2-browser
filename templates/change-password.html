<button
  commandfor="dialog"
  command="show-modal"
  class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-xs transition disabled:opacity-50 disabled:pointer-events-none"
>
  Change password
</button>
<dialog
  id="dialog"
  class="m-auto w-full max-w-sm p-6 bg-white rounded-2xl shadow-2xl border-0 backdrop:bg-black/45 backdrop:backdrop-blur-xs"
>
  <h3 class="text-base font-semibold text-zinc-900 mb-5">Change password</h3>
  <form class="space-y-4">
    <input
      type="password"
      name="password"
      required
      class="w-full px-3 py-2 text-sm rounded-lg border border-zinc-200 outline-none transition focus:border-blue-500 focus:ring-3 focus:ring-blue-500/15 user-invalid:focus:border-rose-500 user-invalid:focus:ring-rose-500/15"
    />
    <div class="pt-2 flex justify-end gap-2.5">
      <button
        type="button"
        commandfor="dialog"
        command="close"
        class="px-4 py-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 active:bg-zinc-200 rounded-lg transition-colors cursor-pointer"
      >
        Cancel
      </button>
      <button
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-lg shadow-sm transition-colors cursor-pointer"
      >
        Submit
      </button>
    </div>
  </form>
</dialog>
<script type="module">
  const dialog = document.querySelector('dialog')
  const form = document.querySelector('form')

  dialog.addEventListener('close', () => form.reset())
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    try {
      const res = await fetch('/api/user', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form).entries())),
      })
      if (res.ok) {
        alert('password change successful')
      } else {
        alert('password change failed')
      }
      dialog.close()
    } catch (e) {
      console.error(e)
      alert('password change failed')
    }
  })
</script>
